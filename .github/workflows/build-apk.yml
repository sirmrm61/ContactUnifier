name: Build Contact Unifier APK

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create License Files
        run: |
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "8933bad161af4b39a7f61aeba3fa7414d1a63f4a" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131b33910" > $ANDROID_SDK_ROOT/licenses/intel-android-extra-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license

      - name: Install SDK Platforms (no sdkmanager calls needed - already installed)
        run: |
          echo "Android SDK is already configured on GitHub runners"
          ls -la $ANDROID_SDK_ROOT/platforms/ | head -10 || echo "Checking build-tools instead..."
          ls -la $ANDROID_SDK_ROOT/build-tools/ | head -10 || echo "SDK configured, proceeding..."

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace -x lint

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace -x lint || true

      - name: Check Build Outputs
        if: always()
        run: |
          echo "=== Looking for APK files ==="
          find app/build/outputs -type f -name "*.apk" -ls 2>/dev/null || echo "No APK files generated"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: contact-unifier-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-unifier-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Build Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Contact Unifier Build Complete"
          echo "=========================================="
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(stat -f%z app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || stat -c%s app/build/outputs/apk/debug/app-debug.apk 2>/dev/null)
            echo "✅ Debug APK built: $(numfmt --to=iec-i --suffix=B -- $SIZE 2>/dev/null || echo "$SIZE bytes")"
          else
            echo "❌ Debug APK build failed - check logs"
          fi
          echo "=========================================="
