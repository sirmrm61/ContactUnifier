name: Build Contact Unifier APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android Licenses
      run: |
        echo y | sdkmanager "platforms;android-35"
        echo y | sdkmanager "build-tools;35.0.0"
        echo y | sdkmanager "platform-tools"

    - name: Make Gradle Executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew clean assembleDebug --stacktrace

    - name: Build Release APK (unsigned)
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: contact-unifier-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: contact-unifier-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release-unsigned.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Print Build Info
      if: always()
      run: |
        echo "=== Contact Unifier Build Complete ==="
        echo "Debug APK: app/build/outputs/apk/debug/app-debug.apk"
        echo "Release APK: app/build/outputs/apk/release/app-release-unsigned.apk"
        ls -lh app/build/outputs/apk/*/
