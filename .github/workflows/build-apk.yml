name: Build Contact Unifier APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # امکان اجرای دستی از تب Actions

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-levels: '34'
          ndk-version: '26.0.10957603'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: contact-unifier-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: contact-unifier-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Build Info
        if: always()
        run: |
          echo "=== Contact Unifier Build Complete ==="
          echo "Debug APK expected at : app/build/outputs/apk/debug/app-debug.apk"
          echo "Release APK expected at: app/build/outputs/apk/release/app-release-unsigned.apk"
          echo ""
          echo "=== Searching for APK files ==="
          find app/build/outputs -name "*.apk" -type f -exec ls -lh {} \; 2>/dev/null || echo "No APK files found"
          echo ""
          echo "=== Directory structure ==="
          if [ -d "app/build/outputs/apk" ]; then
            ls -laR app/build/outputs/apk/
          else
            echo "Directory app/build/outputs/apk does not exist"
            echo "This usually means the build steps failed."
          fi
